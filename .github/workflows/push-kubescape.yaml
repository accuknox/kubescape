---
name: Publish Kubescape

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  ALIAS: k9v9d5v2

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-2404-2core
    steps:
      # ---------------------------------------------------------------
      # 1. Environment setup
      # ---------------------------------------------------------------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h

      - name: Check Out Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ---------------------------------------------------------------
      # 2. Discover the correct package paths (prints to log)
      # ---------------------------------------------------------------
      - name: Discover repo layout
        run: |
          echo "===== Top-level ====="
          ls -la
          echo
          echo "===== cmd/ tree (2 levels) ====="
          find cmd -maxdepth 2 -type d 2>/dev/null || echo "no cmd/ dir"
          echo
          echo "===== All main.go files ====="
          find . -name main.go -not -path './vendor/*' -not -path './.git/*'
          echo
          echo "===== Go main packages ====="
          go list -f '{{.ImportPath}} [{{.Name}}]' ./... 2>/dev/null | grep '\[main\]' || true
          echo
          echo "===== Files named like our targets ====="
          find . -type f \( -name 'kubescape*' -o -name 'ksserver*' -o -name 'downloader*' \) \
            -not -path './vendor/*' -not -path './.git/*' 2>/dev/null || true

      # ---------------------------------------------------------------
      # 3. Auto-resolve the three package paths into env vars
      #    (falls back gracefully if a package isn't found)
      # ---------------------------------------------------------------
      - name: Resolve build targets
        id: resolve
        run: |
          find_pkg () {
            local name="$1"
            local hit
            # 1) Directory named $name containing main.go
            hit=$(find . -type d -name "$name" -not -path './vendor/*' \
                  -exec test -f '{}/main.go' \; -print 2>/dev/null | head -n1)
            if [ -n "$hit" ]; then
              echo "./${hit#./}"
              return
            fi
            # 2) Any main package whose import path ends with /$name
            go list -f '{{.ImportPath}} {{.Name}}' ./... 2>/dev/null \
              | awk -v n="$name" '$2=="main" && $1 ~ ("/"n"$") {print $1; exit}'
          }

          KS=$(find_pkg kubescape)
          KSS=$(find_pkg ksserver)
          DL=$(find_pkg downloader)

          echo "kubescape  -> [$KS]"
          echo "ksserver   -> [$KSS]"
          echo "downloader -> [$DL]"

          # Fail fast with a helpful message if any are missing
          missing=""
          [ -z "$KS" ]  && missing="$missing kubescape"
          [ -z "$KSS" ] && missing="$missing ksserver"
          [ -z "$DL" ]  && missing="$missing downloader"
          if [ -n "$missing" ]; then
            echo "::error::Could not locate main packages for:$missing"
            echo "See 'Discover repo layout' output above and set paths manually."
            exit 1
          fi

          {
            echo "KUBESCAPE_PKG=$KS"
            echo "KSSERVER_PKG=$KSS"
            echo "DOWNLOADER_PKG=$DL"
          } >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 4. Cross-compile binaries for both target platforms.
      #    Dockerfiles do: COPY $TARGETPLATFORM/<bin> ...
      #    so we must produce ./linux/amd64/<bin> and ./linux/arm64/<bin>
      # ---------------------------------------------------------------
      - name: Build binaries (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p linux/amd64
          go build -trimpath -ldflags "-s -w" -o linux/amd64/kubescape  "$KUBESCAPE_PKG"
          go build -trimpath -ldflags "-s -w" -o linux/amd64/ksserver   "$KSSERVER_PKG"
          go build -trimpath -ldflags "-s -w" -o linux/amd64/downloader "$DOWNLOADER_PKG"
          ls -lh linux/amd64

      - name: Build binaries (linux/arm64)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          mkdir -p linux/arm64
          go build -trimpath -ldflags "-s -w" -o linux/arm64/kubescape  "$KUBESCAPE_PKG"
          go build -trimpath -ldflags "-s -w" -o linux/arm64/ksserver   "$KSSERVER_PKG"
          go build -trimpath -ldflags "-s -w" -o linux/arm64/downloader "$DOWNLOADER_PKG"
          ls -lh linux/arm64

      # ---------------------------------------------------------------
      # 5. Docker/Buildx setup + registry login
      # ---------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Cache Docker layers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-kubescape-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-kubescape-

      - name: Set up AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEV_ACCESS_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEV_SECRET_ID }}
          aws-region: us-east-1

      - name: Login to AWS ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws/${{ env.ALIAS }}

      - name: Get version
        id: get_version
        uses: crazy-max/ghaction-docker-meta@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: |
            ${{ env.ALIAS }}/kubescape
            ${{ env.ALIAS }}/kubescape-cli
          tag-semver: |
            {{version}}

      # ---------------------------------------------------------------
      # 6. Build + push kubescape (server) image
      # ---------------------------------------------------------------
      - name: Build and push kubescape - Docker/ECR
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64,linux/arm64
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          build-args: |
            image_version=${{ steps.get_version.outputs.version }}
            client=${{ steps.get_version.outputs.version }}
          tags: |
            public.ecr.aws/${{ env.ALIAS }}/kubescape:${{ steps.get_version.outputs.version }}
            public.ecr.aws/${{ env.ALIAS }}/kubescape:latest
          cache-from: type=local,src=/tmp/.buildx-cache/release
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache/release

      # ---------------------------------------------------------------
      # 7. Build + push kubescape-cli image
      # ---------------------------------------------------------------
      - name: Build and push kubescape-cli - Docker/ECR
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: build/kubescape-cli.Dockerfile
          platforms: linux/amd64,linux/arm64
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          build-args: |
            image_version=${{ steps.get_version.outputs.version }}
            client=${{ steps.get_version.outputs.version }}
          tags: |
            public.ecr.aws/${{ env.ALIAS }}/kubescape-cli:${{ steps.get_version.outputs.version }}
            public.ecr.aws/${{ env.ALIAS }}/kubescape-cli:latest
          cache-from: type=local,src=/tmp/.buildx-cache/release
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache/release
